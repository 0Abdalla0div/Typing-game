<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>fast typing test</title>
    <style>
      :root {
        --main-color: #2196f3;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: "Open Sans", sans-serif;
      }
      .game {
        background-color: #eee;
        min-height: 100vh;
      }
      .container {
        margin: auto;
        max-width: 900px;
        position: relative;
      }
      .name {
        background-color: var(--main-color);
        color: white;
        padding: 20px;
        font-size: 25px;
        text-align: center;
        font-weight: bold;
      }
      .message {
        background-color: white;
        padding: 15px;
        margin: 15px 0;
        border-radius: 6px;
        text-align: center;
      }
      .message span {
        font-weight: bold;
        color: #009688;
      }
      .message span::after {
        content: "]";
      }
      .message span::before {
        content: "[";
      }
      .start {
        font-size: 20px;
        font-weight: bold;
        text-align: center;
        background-color: #009688;
        color: white;
        padding: 20px;
        cursor: pointer;
      }
      .the-word {
        text-align: center;
        font-weight: bold;
        font-size: 60px;
        color: var(--main-color);
        user-select: none;
      }
      .input {
        margin: 15px auto;
        width: 100%;
        display: block;
        padding: 15px;
        border: 3px solid var(--main-color);
        font-size: 20px;
        text-align: center;
        text-transform: capitalize;
        border-radius: 6px;
        caret-color: var(--main-color);
      }

      .input:focus {
        outline: none;
      }
      .upcoming-words {
        background-color: white;
        margin: 15px 0;
        padding: 15px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
      }
      .upcoming-words div {
        background-color: var(--main-color);
        color: white;
        font-weight: bold;
        margin: 4px;
        padding: 10px;
        border-radius: 6px;
      }
      .control {
        display: flex;
        justify-content: space-between;
        background-color: white;
        padding: 15px;
      }
      .control span {
        font-weight: bold;
        color: #009688;
      }
      .finish {
        font-weight: bold;
        font-size: 40px;
        text-align: center;
        padding: 15px;
      }
      .finish .good {
        color: var(--main-color);
      }
      .finish {
        color: red;
      }
      .changedef2 {
        display: inline;
        margin-bottom: 15px;
        height: 60px;
        width: 190px;
        border-radius: 5px;
        border: 2px solid var(--main-color);
        background: var(--main-color);
        color: white;
        font-size: 20px;

        cursor: pointer;
      }
      .remove {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="game">
      <div class="name">Typing Speed Test Game</div>
      <div class="container">
        <div class="message">
          You Are Playing On <span class="lvl"></span> Level & You Have
          <span class="seconds"></span> Seconds To Type The Word
        </div>
        <button class="changedef2 btn">Change defficulty</button>
        <div class="start btn">Start Playing</div>
        <div class="the-word"></div>
        <input type="text" class="input" />
        <div class="upcoming-words">Words Will Show Here</div>
        <div class="control">
          <div class="time">Time Left: <span></span> Seconds</div>
          <div class="score">
            Score: <span class="got">0</span> From <span class="total"></span>
          </div>
        </div>
        <div class="finish"></div>
      </div>
    </div>
    <script>
      // array words
      let words = {
        Easy: [
          "focus",
          "drive",
          "skill",
          "impact",
          "value",
          "time",
          "habit",
          "energy",
          "future",
          "growth",
          "belief",
          "system",
          "action",
          "effort",
          "vision",
        ],
        Normal: [
          "success",
          "freedom",
          "learning",
          "progress",
          "strength",
          "mindset",
          "balance",
          "patience",
          "passion",
          "clarity",
          "mastery",
          "clarity",
          "freedom",
          "practice",
          "mastery",
          "journey",
          "results",
          "ambition",
          "momentum",
          "courage",
          "strategy",
          "purpose",
        ],
        Hard: [
          "discipline",
          "challenge",
          "consistency",
          "confidence",
          "potential",
          "simplicity",
          "reflection",
          "execution",
          "opportunity",
          "direction",
          "determination",
          "adaptation",
          "improvement",
          "commitment",
          "resilience",
          "creativity",
        ],
      };
      // setting level
      const lvls = {
        Easy: 4,
        Normal: 4,
        Hard: 5,
      };
      // level name and arr of words
      let LevelName = "Normal";
      let levelSeconds = lvls[LevelName];
      let arrOfWords = [...words[LevelName]];
      //  selectors
      const input = document.querySelector(".input");
      const startButton = document.querySelector(".start");
      const lvlname = document.querySelector(".lvl");
      const seconds = document.querySelector(".seconds");
      const theWord = document.querySelector(".the-word");
      const upcomingword = document.querySelector(".upcoming-words");
      const timeLeft = document.querySelector(".time span");
      const score = document.querySelector(".got");
      const total = document.querySelector(".total");
      const finishMassage = document.querySelector(".finish");
      const diffbtn = document.querySelector(".changedef2");
      const btns = document.querySelectorAll(".btn");

      // DOm Info fill
      function fillDom() {
        lvlname.textContent = LevelName;
        seconds.textContent = levelSeconds;
        total.textContent = arrOfWords.length;
        timeLeft.textContent = levelSeconds;
      }
      fillDom();
      //DISABLE PASTE

      input.onpaste = function () {
        return false;
      };
      //diff change
      diffbtn.onclick = function () {
        if (LevelName === "Easy") {
          LevelName = "Normal";
        } else if (LevelName === "Normal") {
          LevelName = "Hard";
        } else {
          LevelName = "Easy";
        }
        levelSeconds = lvls[LevelName];
        arrOfWords = [...words[LevelName]];
        fillDom();
      };
      // start game

      startButton.onclick = function () {
        btns.forEach((bt) => {
          bt.classList.add("remove");
        });
        input.focus();
        // genarate words
        genword();
        timeLeft.textContent = +timeLeft.textContent + 2;
      };

      // genarate words function

      function genword() {
        // random word
        let randomword =
          arrOfWords[Math.floor(Math.random() * arrOfWords.length)];
        // removing word from arr
        let worindex = arrOfWords.indexOf(randomword);
        arrOfWords.splice(worindex, 1);
        // upcoming words
        upcomingword.innerHTML = "";
        for (i = 0; i < arrOfWords.length; i++) {
          let div = document.createElement("div");
          let txt = document.createTextNode(arrOfWords[i]);
          div.appendChild(txt);
          upcomingword.appendChild(div);
        }
        // show the worddw
        theWord.textContent = randomword;
        //start the game
        startplay();
      }

      function startplay() {
        timeLeft.textContent = levelSeconds;
        //start timer
        let start = setInterval(() => {
          timeLeft.textContent--;
          if (timeLeft.textContent === "0") {
            if (
              theWord.textContent.toLowerCase() === input.value.toLowerCase()
            ) {
              score.textContent++;
              input.value = "";
              if (arrOfWords.length > 0) {
                genword();
              } else {
                upcomingword.remove();
                let span = document.createElement("span");
                span.className = "good";
                let spantxt = document.createTextNode("good job");
                span.appendChild(spantxt);
                finishMassage.appendChild(span);
              }
            } else {
              let span = document.createElement("span");
              span.className = "bad";
              let spantxt = document.createTextNode("game over");
              span.appendChild(spantxt);
              finishMassage.appendChild(span);
            }

            clearInterval(start);
          }
        }, 1000);
        // ceack the word
      }
    </script>
  </body>
</html>
